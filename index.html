<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Conta Certa — Faturamento & Financeiro</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/iv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    const STATS = [
      { value: '84 mil', labelKey: 'home.stats.invoices' },
      { value: '3.200', labelKey: 'home.stats.companies' },
      { value: '11', labelKey: 'home.stats.hours' },
      { value: '4,8', labelKey: 'home.stats.rating' },
    ];

    const LOGOS = ['Vida Plena', 'TechNova', 'Serra Azul', 'Bom Preço', 'Studio Alfa', 'Andrade'];

    /** Redução de tempo assumida ao trocar planilha + editor de texto pelo app. */
    const AUTOMATION_FACTOR = 0.8;
    const savings = { invoices: 40, minutes: 12, rate: 120 };

    function savingsResult() {
      const manualHours = Query.round2((savings.invoices * savings.minutes) / 60);
      const savedHours = Query.round2(manualHours * AUTOMATION_FACTOR);
      const savedMonthly = Query.round2(savedHours * savings.rate);
      return { manualHours, savedHours, savedMonthly, savedYearly: Query.round2(savedMonthly * 12) };
    }

    function savingsCalculator() {
      const t = UI.t;
      const rows = [
        { key: 'invoices', min: 5, max: 200, step: 5, display: String(savings.invoices) },
        { key: 'minutes', min: 3, max: 40, step: 1, display: t('savings.minutesValue', { count: savings.minutes }) },
        { key: 'rate', min: 40, max: 400, step: 10, display: UI.fmt(savings.rate) },
      ];
      const r = savingsResult();

      return '<div class="grid gap-6 rounded-2xl border border-themed surface-card p-6 md:p-8 lg:grid-cols-2">' +
        '<div class="space-y-6">' +
        rows.map((row) =>
          '<div><div class="flex items-center justify-between gap-3">' +
          '<label class="text-sm font-medium text-heading" for="sav-' + row.key + '">' + t('savings.' + row.key) + '</label>' +
          '<span class="text-sm font-semibold text-brand-600 dark:text-brand-400" data-sav-display="' + row.key + '">' + row.display + '</span>' +
          '</div>' +
          '<input id="sav-' + row.key + '" type="range" min="' + row.min + '" max="' + row.max + '" step="' + row.step + '" ' +
          'value="' + savings[row.key] + '" data-sav="' + row.key + '" class="mt-3 w-full accent-brand-500"/></div>'
        ).join('') +
        '<p class="flex items-start gap-2 text-xs text-muted">' + UI.icon('info', { size: 14, className: 'mt-0.5 shrink-0' }) +
        t('savings.disclaimer', { percent: AUTOMATION_FACTOR * 100 }) + '</p>' +
        '</div>' +
        '<div class="flex flex-col justify-center rounded-2xl bg-brand-500 p-6 text-white md:p-8">' +
        '<p class="text-sm text-brand-100">' + t('savings.resultLabel') + '</p>' +
        '<p class="mt-2 text-title-sm font-bold" data-sav-hours>' + t('savings.hoursValue', { count: r.savedHours }) + '</p>' +
        '<p class="mt-1 text-sm text-brand-100" data-sav-of>' + t('savings.ofHours', { count: r.manualHours }) + '</p>' +
        '<div class="mt-6 space-y-3 border-t border-white/20 pt-6">' +
        '<div class="flex items-center justify-between gap-3"><span class="text-sm text-brand-100">' + t('savings.perMonth') + '</span>' +
        '<span class="text-lg font-semibold" data-sav-month>' + UI.fmt(r.savedMonthly) + '</span></div>' +
        '<div class="flex items-center justify-between gap-3"><span class="text-sm text-brand-100">' + t('savings.perYear') + '</span>' +
        '<span class="text-lg font-semibold" data-sav-year>' + UI.fmt(r.savedYearly) + '</span></div>' +
        '</div></div></div>';
    }

    /** Atualiza só os nós de resultado — o slider não perde o foco. */
    function refreshSavings() {
      const t = UI.t;
      const r = savingsResult();
      const set = (sel, value) => { const el = document.querySelector(sel); if (el) el.textContent = value; };
      set('[data-sav-display="invoices"]', String(savings.invoices));
      set('[data-sav-display="minutes"]', t('savings.minutesValue', { count: savings.minutes }));
      set('[data-sav-display="rate"]', UI.fmt(savings.rate));
      set('[data-sav-hours]', t('savings.hoursValue', { count: r.savedHours }));
      set('[data-sav-of]', t('savings.ofHours', { count: r.manualHours }));
      set('[data-sav-month]', UI.fmt(r.savedMonthly));
      set('[data-sav-year]', UI.fmt(r.savedYearly));
    }

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon;
      const highlights = Data.FEATURE_KEYS.slice(0, 3);

      const preview =
        '<div class="surface-card rounded-2xl border p-6 shadow-theme-lg">' +
        '<div class="flex items-start justify-between"><div class="flex items-center gap-3">' +
        '<span class="flex h-10 w-10 items-center justify-center rounded-lg bg-brand-500 text-sm font-bold text-white">CC</span>' +
        '<div><p class="text-sm font-semibold text-heading">CC-0022</p><p class="text-xs text-muted">TechNova Sistemas</p></div></div>' +
        '<span class="rounded-full bg-success-50 px-2.5 py-1 text-xs font-medium text-success-700 dark:bg-success-500/15 dark:text-success-500">' +
        t('invoiceStatuses.paga') + '</span></div>' +
        '<ul class="mt-6 space-y-3 text-sm">' +
        [{ label: t('home.preview.item1'), value: 882 }, { label: t('home.preview.item2'), value: 387 }].map((row) =>
          '<li class="flex items-center justify-between gap-3"><span class="truncate text-muted">' + row.label + '</span>' +
          '<span class="shrink-0 font-medium text-heading">' + UI.fmt(row.value) + '</span></li>'
        ).join('') +
        '</ul>' +
        '<div class="mt-5 space-y-2 border-t border-themed pt-4 text-sm">' +
        '<div class="flex justify-between text-muted"><span>' + t('items.taxes') + '</span><span>' + UI.fmt(42) + '</span></div>' +
        '<div class="flex justify-between text-base font-bold text-heading"><span>' + t('items.total') + '</span><span>' + UI.fmt(1269) + '</span></div>' +
        '</div>' +
        '<div class="mt-5 flex items-center gap-2 rounded-xl bg-success-50 px-4 py-3 text-xs text-success-700 dark:bg-success-500/10 dark:text-success-500">' +
        icon('check-circle', { size: 16 }) + t('document.settled') + ' — PIX</div></div>';

      const hero =
        '<section class="relative overflow-hidden">' +
        '<div class="pointer-events-none absolute inset-x-0 -top-40 h-96 bg-brand-500/10 blur-3xl"></div>' +
        '<div class="relative mx-auto grid max-w-7xl gap-12 px-4 py-16 sm:px-6 lg:grid-cols-2 lg:items-center lg:py-24 lg:px-8">' +
        '<div>' +
        '<span class="inline-flex items-center gap-2 rounded-full border border-themed px-3 py-1 text-xs font-medium text-muted">' +
        '<span class="h-1.5 w-1.5 rounded-full bg-success-500"></span>' + t('home.hero.badge') + '</span>' +
        '<h1 class="mt-5 font-bold text-heading text-title-sm sm:text-title-md lg:text-title-lg">' + t('home.hero.title') + '</h1>' +
        '<p class="mt-5 max-w-xl text-base text-muted sm:text-lg">' + t('home.hero.subtitle') + '</p>' +
        '<div class="mt-8 flex flex-wrap gap-3">' +
        '<a href="registro.html" class="inline-flex h-12 items-center gap-2 rounded-xl bg-brand-500 px-6 text-sm font-medium text-white transition hover:bg-brand-600">' +
        t('home.hero.cta') + icon('arrow-right', { size: 18 }) + '</a>' +
        '<a href="precos.html" class="inline-flex h-12 items-center gap-2 rounded-xl border border-themed px-6 text-sm font-medium text-body transition hover:bg-gray-50 dark:hover:bg-gray-800">' +
        t('home.hero.secondary') + '</a></div>' +
        '<p class="mt-4 text-xs text-muted">' + t('home.hero.note') + '</p>' +
        '</div>' + preview + '</div></section>';

      const stats =
        '<section class="border-y border-themed surface-card"><div class="mx-auto grid max-w-7xl grid-cols-2 gap-8 px-4 py-10 sm:px-6 lg:grid-cols-4 lg:px-8">' +
        STATS.map((s) => '<div><p class="font-bold text-brand-500 text-title-sm">' + s.value + '</p><p class="mt-1 text-sm text-muted">' + t(s.labelKey) + '</p></div>').join('') +
        '</div></section>';

      const features =
        '<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-20 lg:px-8">' +
        '<div class="max-w-2xl"><p class="text-sm font-semibold uppercase tracking-wider text-brand-500">' + t('home.features.eyebrow') + '</p>' +
        '<h2 class="mt-2 font-bold text-heading text-title-sm">' + t('home.features.title') + '</h2>' +
        '<p class="mt-3 text-muted">' + t('home.features.subtitle') + '</p></div>' +
        '<div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">' +
        highlights.map((key) => UI.featureCard({
          icon: Data.FEATURE_ICONS[key],
          title: t('featureList.' + key + '.title'),
          description: t('featureList.' + key + '.desc'),
        })).join('') + '</div>' +
        '<div class="mt-8"><a href="recursos.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-brand-600 dark:text-brand-400">' +
        t('home.plans.all') + icon('arrow-right', { size: 16 }) + '</a></div></section>';

      const savingsSection =
        '<section class="border-y border-themed bg-gray-50 dark:bg-gray-900/40"><div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-20 lg:px-8">' +
        '<div class="max-w-2xl"><p class="text-sm font-semibold uppercase tracking-wider text-brand-500">' + t('home.savings.eyebrow') + '</p>' +
        '<h2 class="mt-2 font-bold text-heading text-title-sm">' + t('home.savings.title') + '</h2>' +
        '<p class="mt-3 text-muted">' + t('home.savings.subtitle') + '</p></div>' +
        '<div class="mt-10">' + savingsCalculator() + '</div></div></section>';

      const plans =
        '<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-20 lg:px-8">' +
        '<div class="max-w-2xl"><p class="text-sm font-semibold uppercase tracking-wider text-brand-500">' + t('home.plans.eyebrow') + '</p>' +
        '<h2 class="mt-2 font-bold text-heading text-title-sm">' + t('home.plans.title') + '</h2>' +
        '<p class="mt-3 text-muted">' + t('home.plans.subtitle') + '</p></div>' +
        '<div class="mt-10 grid gap-6 lg:grid-cols-3">' + Data.PLANS.map((p) => UI.planCard(p, p.price, false)).join('') + '</div></section>';

      const trust =
        '<section class="mx-auto max-w-7xl px-4 pb-16 sm:px-6 lg:px-8">' +
        '<p class="text-center text-sm text-muted">' + t('home.trust.title') + '</p>' +
        '<div class="mt-8 flex flex-wrap items-center justify-center gap-x-10 gap-y-4">' +
        LOGOS.map((l) => '<span class="text-base font-semibold text-gray-400 dark:text-gray-600">' + l + '</span>').join('') +
        '</div></section>';

      const cta =
        '<section class="mx-auto max-w-7xl px-4 pb-20 sm:px-6 lg:px-8">' +
        '<div class="overflow-hidden rounded-3xl bg-brand-500 px-6 py-14 text-center sm:px-12">' +
        '<h2 class="mx-auto max-w-2xl font-bold text-white text-title-sm">' + t('home.cta.title') + '</h2>' +
        '<p class="mx-auto mt-3 max-w-xl text-brand-100">' + t('home.cta.subtitle') + '</p>' +
        '<a href="registro.html" class="mt-8 inline-flex h-12 items-center gap-2 rounded-xl bg-white px-6 text-sm font-semibold text-brand-600 transition hover:bg-brand-25">' +
        t('home.cta.button') + icon('arrow-right', { size: 18 }) + '</a></div></section>';

      document.getElementById('page').innerHTML =
        hero + stats + features + savingsSection + plans + trust + cta;

      document.querySelectorAll('[data-sav]').forEach((el) =>
        el.addEventListener('input', () => {
          savings[el.getAttribute('data-sav')] = Number(el.value);
          refreshSavings();
        })
      );
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>

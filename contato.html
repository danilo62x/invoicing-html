<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Contato — Conta Certa</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/iv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    const SUBJECTS = ['demo', 'support', 'billing', 'partnership'];

    const form = { name: '', email: '', company: '', phone: '', subject: '', message: '' };
    let errors = {};

    /** Mesmas regras do schema Yup do React. */
    function validate() {
      const t = UI.t;
      const next = {};
      if (!form.name.trim()) next.name = t('validation.required');
      if (!form.email.trim()) next.email = t('validation.required');
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) next.email = t('validation.email');
      if (!form.subject) next.subject = t('validation.required');
      if (!form.message.trim()) next.message = t('validation.required');
      else if (form.message.trim().length < 10) next.message = t('validation.min', { count: 10 });
      errors = next;
      return Object.keys(next).length === 0;
    }

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, esc = UI.esc;
      const company = IV.get().company;

      const CHANNELS = [
        { icon: 'mail', labelKey: 'contact.channels.email', value: company.email },
        { icon: 'phone', labelKey: 'contact.channels.phone', value: company.phone },
        { icon: 'map-pin', labelKey: 'contact.channels.address', value: company.address },
        { icon: 'clock', labelKey: 'contact.channels.hours', value: t('contact.channels.hoursValue') },
      ];

      const input = 'h-11 w-full rounded-lg border border-themed bg-transparent px-3 text-sm text-body focus-ring';
      const err = (key) => errors[key] ? '<p class="mt-1.5 text-xs text-error-500">' + errors[key] + '</p>' : '';

      const field = (key, label, attrs, placeholder) =>
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + label + '</label>' +
        '<input data-field="' + key + '" value="' + esc(form[key]) + '" ' + (attrs || '') +
        ' placeholder="' + esc(placeholder || '') + '" class="' + input + '"/>' + err(key) + '</div>';

      const formCard =
        '<div class="rounded-2xl border border-themed surface-card p-6 shadow-theme-sm md:p-8">' +
        '<form data-contact-form class="space-y-5" novalidate>' +
        '<div class="grid gap-5 sm:grid-cols-2">' + field('name', t('contact.form.name'), '', 'Ana Martins') +
        field('email', t('contact.form.email'), 'type="email"', 'ana@empresa.com.br') + '</div>' +
        '<div class="grid gap-5 sm:grid-cols-2">' + field('company', t('contact.form.company'), '', 'Empresa') +
        field('phone', t('contact.form.phone'), '', '(11) 90000-0000') + '</div>' +
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('contact.form.subject') + '</label>' +
        '<select data-field="subject" class="' + input + '">' +
        '<option value="">' + t('contact.form.subjectPlaceholder') + '</option>' +
        SUBJECTS.map((s) => '<option value="' + s + '" ' + (form.subject === s ? 'selected' : '') + '>' + t('contact.subjects.' + s) + '</option>').join('') +
        '</select>' + err('subject') + '</div>' +
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('contact.form.message') + '</label>' +
        '<textarea data-field="message" rows="5" placeholder="' + esc(t('contact.form.messagePlaceholder')) + '" ' +
        'class="w-full rounded-lg border border-themed bg-transparent px-3 py-2 text-sm text-body focus-ring">' + esc(form.message) + '</textarea>' +
        err('message') + '</div>' +
        '<button type="submit" class="inline-flex h-12 items-center gap-2 rounded-xl bg-brand-500 px-6 text-sm font-medium text-white transition hover:bg-brand-600">' +
        t('contact.form.submit') + icon('arrow-right', { size: 18 }) + '</button>' +
        '</form></div>';

      const aside =
        '<aside class="space-y-4 lg:col-span-2">' +
        CHANNELS.map((c) =>
          '<div class="flex gap-4 rounded-2xl border border-themed surface-card p-5">' +
          '<span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-500 dark:bg-brand-500/15">' +
          icon(c.icon, { size: 20 }) + '</span>' +
          '<div class="min-w-0"><p class="text-xs uppercase tracking-wider text-muted">' + t(c.labelKey) + '</p>' +
          '<p class="mt-1 text-sm font-medium text-heading">' + esc(c.value) + '</p></div></div>'
        ).join('') +
        '<div class="overflow-hidden rounded-2xl border border-themed">' +
        '<div class="flex h-48 items-center justify-center bg-gray-100 text-muted dark:bg-gray-800"><div class="text-center">' +
        icon('map-pin', { size: 28, className: 'mx-auto' }) +
        '<p class="mt-2 text-xs">' + t('contact.mapPlaceholder') + '</p></div></div></div></aside>';

      document.getElementById('page').innerHTML =
        '<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:py-16 lg:px-8">' +
        '<header class="max-w-2xl">' +
        '<p class="text-sm font-semibold uppercase tracking-wider text-brand-500">' + t('contact.eyebrow') + '</p>' +
        '<h1 class="mt-2 font-bold text-heading text-title-sm sm:text-title-md">' + t('contact.title') + '</h1>' +
        '<p class="mt-3 text-muted">' + t('contact.subtitle') + '</p></header>' +
        '<div class="mt-10 grid gap-8 lg:grid-cols-5"><div class="lg:col-span-3">' + formCard + '</div>' + aside + '</div></div>';

      document.querySelectorAll('[data-field]').forEach((el) =>
        el.addEventListener('input', () => { form[el.getAttribute('data-field')] = el.value; })
      );
      document.querySelectorAll('select[data-field]').forEach((el) =>
        el.addEventListener('change', () => { form[el.getAttribute('data-field')] = el.value; })
      );

      const el = document.querySelector('[data-contact-form]');
      el.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!validate()) { window.renderPage(); return; }
        UI.notify(t('contact.success'), 'success');
        Object.keys(form).forEach((k) => { form[k] = ''; });
        errors = {};
        window.renderPage();
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>

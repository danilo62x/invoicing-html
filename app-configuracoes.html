<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Configurações — Conta Certa</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/iv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="app" data-guard="true">
  <div id="app"><div id="page"></div></div>

  <script>
    let tab = 0;
    const user = Auth.getUser() || {};
    const profile = { name: user.name || '', email: user.email || '' };
    let form = Object.assign({}, IV.get().company);

    window.onTabChange = function (index) {
      tab = index;
      window.renderPage();
    };

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, esc = UI.esc;
      const current = Auth.getUser() || {};
      const input = 'h-11 w-full rounded-lg border border-themed bg-transparent px-3.5 text-sm text-body focus-ring';
      const primaryBtn = 'h-11 rounded-lg bg-brand-500 px-5 text-sm font-medium text-white transition hover:bg-brand-600';

      const field = (attr, key, label, attrs, value) =>
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + label + '</label>' +
        '<input data-' + attr + '="' + key + '" value="' + esc(value) + '" ' + (attrs || '') + ' class="' + input + '"/></div>';

      const profileTab =
        '<form data-form="profile" class="max-w-lg space-y-4">' +
        '<h3 class="font-semibold text-heading">' + t('settings.profile.title') + '</h3>' +
        field('profile', 'name', t('settings.profile.name'), '', profile.name) +
        field('profile', 'email', t('settings.profile.email'), 'type="email"', profile.email) +
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('settings.profile.role') + '</label>' +
        '<input value="' + esc(current.role || '') + '" disabled class="' + input + ' opacity-60"/></div>' +
        '<button type="submit" class="' + primaryBtn + '">' + t('common.save') + '</button></form>';

      const companyTab =
        '<form data-form="company" class="max-w-2xl space-y-4">' +
        '<h3 class="font-semibold text-heading">' + t('settings.company.title') + '</h3>' +
        '<div class="grid gap-4 sm:grid-cols-2">' +
        field('company', 'name', t('settings.company.name'), '', form.name) +
        field('company', 'legalName', t('settings.company.legalName'), '', form.legalName) +
        field('company', 'taxId', t('settings.company.taxId'), '', form.taxId) +
        field('company', 'logoText', t('settings.company.logoText'), 'maxlength="3"', form.logoText) +
        field('company', 'email', t('settings.company.email'), 'type="email"', form.email) +
        field('company', 'phone', t('settings.company.phone'), '', form.phone) +
        '<div class="sm:col-span-2"><label class="mb-1.5 block text-sm font-medium text-heading">' + t('settings.company.address') + '</label>' +
        '<input data-company="address" value="' + esc(form.address) + '" class="' + input + '"/></div>' +
        '</div><button type="submit" class="' + primaryBtn + '">' + t('common.save') + '</button></form>';

      const numberingTab =
        '<form data-form="numbering" class="max-w-lg space-y-4">' +
        '<h3 class="font-semibold text-heading">' + t('settings.numbering.title') + '</h3>' +
        '<div class="grid gap-4 sm:grid-cols-2">' +
        field('company', 'invoicePrefix', t('settings.numbering.prefix'), '', form.invoicePrefix) +
        field('company', 'nextNumber', t('settings.numbering.nextNumber'), 'type="number" min="1"', form.nextNumber) +
        '</div>' +
        '<div class="rounded-xl border border-dashed border-themed p-4">' +
        '<p class="text-xs text-muted">' + t('settings.numbering.preview') + '</p>' +
        '<p class="mt-1 text-lg font-bold text-heading" data-number-preview>' + esc(Query.nextInvoiceNumber(form)) + '</p></div>' +
        '<p class="text-xs text-muted">' + t('settings.numbering.hint') + '</p>' +
        '<button type="submit" class="' + primaryBtn + '">' + t('common.save') + '</button></form>';

      const defaultsTab =
        '<form data-form="defaults" class="max-w-lg space-y-4">' +
        '<h3 class="font-semibold text-heading">' + t('settings.defaults.title') + '</h3>' +
        '<div class="grid gap-4 sm:grid-cols-2">' +
        field('company', 'defaultTaxRate', t('settings.defaults.taxRate'), 'type="number" min="0" max="100" step="0.5"', form.defaultTaxRate) +
        field('company', 'defaultTermDays', t('settings.defaults.termDays'), 'type="number" min="0" max="180"', form.defaultTermDays) +
        '</div><p class="text-xs text-muted">' + t('settings.defaults.hint') + '</p>' +
        '<button type="submit" class="' + primaryBtn + '">' + t('common.save') + '</button></form>';

      const preferencesTab =
        '<div class="max-w-lg space-y-1">' +
        '<h3 class="mb-4 font-semibold text-heading">' + t('settings.preferences.title') + '</h3>' +
        '<div class="flex items-center justify-between border-b border-themed py-4">' +
        '<div class="pr-4"><p class="text-sm font-medium text-heading">' + t('settings.preferences.darkMode') + '</p>' +
        '<p class="text-xs text-muted">' + t('settings.preferences.darkModeDesc') + '</p></div>' +
        UI.switchToggle(UIState.get().darkMode, 'data-pref-dark') + '</div>' +
        '<div class="flex items-center justify-between border-b border-themed py-4">' +
        '<div class="pr-4"><p class="text-sm font-medium text-heading">' + t('settings.preferences.language') + '</p>' +
        '<p class="text-xs text-muted">' + t('settings.preferences.languageDesc') + '</p></div>' +
        '<select data-pref-lang class="h-10 rounded-lg border border-themed bg-transparent px-3 text-sm text-body focus-ring">' +
        I18n.LANGUAGES.map((l) => '<option value="' + l.code + '" ' + (l.code === UI.lang() ? 'selected' : '') + '>' + l.label + '</option>').join('') +
        '</select></div>' +
        '<div class="flex items-center justify-between py-4">' +
        '<div class="pr-4"><p class="text-sm font-medium text-heading">' + t('settings.preferences.resetData') + '</p>' +
        '<p class="text-xs text-muted">' + t('settings.preferences.resetDataDesc') + '</p></div>' +
        '<button type="button" data-pref-reset class="inline-flex h-10 items-center gap-2 rounded-lg border border-themed px-4 text-sm font-medium text-body transition hover:bg-gray-50 dark:hover:bg-gray-800">' +
        icon('refresh-cw', { size: 16 }) + t('settings.preferences.resetButton') + '</button></div>' +
        '</div>';

      const tabs = [
        { label: t('settings.tabs.profile'), icon: 'user', content: profileTab },
        { label: t('settings.tabs.company'), icon: 'store', content: companyTab },
        { label: t('settings.tabs.numbering'), icon: 'barcode', content: numberingTab },
        { label: t('settings.tabs.defaults'), icon: 'percent', content: defaultsTab },
        { label: t('settings.tabs.preferences'), icon: 'settings', content: preferencesTab },
      ];

      document.getElementById('page').innerHTML =
        UI.pageHeader({
          title: t('settings.title'),
          subtitle: t('settings.subtitle'),
          crumbs: [{ label: t('appNav.dashboard'), href: 'app.html', icon: 'dashboard' }, { label: t('settings.title') }],
        }) +
        '<div class="surface-card rounded-2xl border p-5 md:p-6">' + UI.tabs(tabs, tab) + '</div>' +
        '<p class="mt-4 inline-flex items-center gap-2 text-xs text-muted">' + icon('info', { size: 14 }) + ' ' + t('auth.demoHint') + '</p>';

      // ── Campos ──
      document.querySelectorAll('[data-profile]').forEach((el) =>
        el.addEventListener('input', () => { profile[el.getAttribute('data-profile')] = el.value; })
      );

      const NUMERIC = ['nextNumber', 'defaultTaxRate', 'defaultTermDays'];
      document.querySelectorAll('[data-company]').forEach((el) =>
        el.addEventListener('input', () => {
          const key = el.getAttribute('data-company');
          if (key === 'logoText' || key === 'invoicePrefix') form[key] = el.value.toUpperCase();
          else if (key === 'nextNumber') form[key] = Math.max(1, Number(el.value) || 1);
          else if (key === 'defaultTaxRate') form[key] = Math.min(100, Math.max(0, Number(el.value) || 0));
          else if (key === 'defaultTermDays') form[key] = Math.max(0, Number(el.value) || 0);
          else form[key] = el.value;
          const preview = document.querySelector('[data-number-preview]');
          if (preview) preview.textContent = Query.nextInvoiceNumber(form);
        })
      );

      // ── Salvar ──
      const onSubmit = (name, fn) => {
        const el = document.querySelector('[data-form="' + name + '"]');
        if (el) el.addEventListener('submit', (e) => { e.preventDefault(); fn(); });
      };

      onSubmit('profile', () => {
        Auth.updateProfile({ name: profile.name, email: profile.email });
        UI.notify(t('settings.profile.saved'), 'success');
        Layout.updateTopbar();
      });
      onSubmit('company', () => {
        IV.updateCompany({
          name: form.name, legalName: form.legalName, taxId: form.taxId, address: form.address,
          email: form.email, phone: form.phone, logoText: form.logoText,
        });
        UI.notify(t('settings.company.saved'), 'success');
      });
      onSubmit('numbering', () => {
        IV.updateCompany({ invoicePrefix: form.invoicePrefix, nextNumber: form.nextNumber });
        UI.notify(t('settings.numbering.saved'), 'success');
      });
      onSubmit('defaults', () => {
        IV.updateCompany({ defaultTaxRate: form.defaultTaxRate, defaultTermDays: form.defaultTermDays });
        UI.notify(t('settings.defaults.saved'), 'success');
      });

      // ── Preferências ──
      const darkEl = document.querySelector('[data-pref-dark]');
      if (darkEl) darkEl.addEventListener('click', () => { UIState.setDarkMode(!UIState.get().darkMode); Layout.updateTopbar(); window.renderPage(); });
      const langEl = document.querySelector('[data-pref-lang]');
      if (langEl) langEl.addEventListener('change', () => { I18n.setLang(langEl.value); UI.notify(t('settings.saved'), 'success'); });
      const resetEl = document.querySelector('[data-pref-reset]');
      if (resetEl) resetEl.addEventListener('click', () => {
        IV.reset();
        form = Object.assign({}, IV.get().company);
        UI.notify(t('settings.preferences.resetDone'), 'success');
        window.renderPage();
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>

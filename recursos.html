<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Recursos — Conta Certa</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/iv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    window.renderPage = function () {
      const t = UI.t, icon = UI.icon;

      const cards = Data.FEATURE_KEYS.map((key) =>
        UI.featureCard({
          icon: Data.FEATURE_ICONS[key],
          title: t('featureList.' + key + '.title'),
          description: t('featureList.' + key + '.desc'),
          bullets: ['b1', 'b2', 'b3'].map((b) => t('featureList.' + key + '.' + b)),
        })
      ).join('');

      const details = Data.FEATURE_KEYS.map((key, index) =>
        '<div class="surface-card grid items-center gap-8 rounded-2xl border p-6 md:p-8 lg:grid-cols-2 ' +
        (index % 2 === 1 ? 'lg:[&>*:first-child]:order-2' : '') + '">' +
        '<div><span class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-50 text-brand-500 dark:bg-brand-500/15">' +
        icon(Data.FEATURE_ICONS[key], { size: 22 }) + '</span>' +
        '<h3 class="mt-4 text-lg font-semibold text-heading">' + t('featureList.' + key + '.title') + '</h3>' +
        '<p class="mt-2 text-sm text-muted">' + t('featureList.' + key + '.desc') + '</p></div>' +
        '<ul class="space-y-3">' +
        ['b1', 'b2', 'b3'].map((b) =>
          '<li class="flex items-start gap-3 rounded-xl border border-themed px-4 py-3 text-sm text-body">' +
          icon('check-circle', { size: 18, className: 'mt-0.5 shrink-0 text-success-500' }) +
          t('featureList.' + key + '.' + b) + '</li>'
        ).join('') +
        '</ul></div>'
      ).join('');

      document.getElementById('page').innerHTML =
        '<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:py-16 lg:px-8">' +
        '<header class="max-w-2xl">' +
        '<p class="text-sm font-semibold uppercase tracking-wider text-brand-500">' + t('features.eyebrow') + '</p>' +
        '<h1 class="mt-2 font-bold text-heading text-title-sm sm:text-title-md">' + t('features.title') + '</h1>' +
        '<p class="mt-3 text-muted">' + t('features.subtitle') + '</p></header>' +
        '<div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">' + cards + '</div>' +
        '<section class="mt-16"><h2 class="font-bold text-heading text-title-sm">' + t('features.detailTitle') + '</h2>' +
        '<div class="mt-8 space-y-6">' + details + '</div></section>' +
        '<section class="mt-16 overflow-hidden rounded-3xl bg-brand-500 px-6 py-12 text-center sm:px-12">' +
        '<h2 class="mx-auto max-w-2xl font-bold text-white text-title-sm">' + t('features.ctaTitle') + '</h2>' +
        '<p class="mx-auto mt-3 max-w-xl text-brand-100">' + t('features.ctaSubtitle') + '</p>' +
        '<a href="registro.html" class="mt-8 inline-flex h-12 items-center gap-2 rounded-xl bg-white px-6 text-sm font-semibold text-brand-600 transition hover:bg-brand-25">' +
        t('features.ctaButton') + icon('arrow-right', { size: 18 }) + '</a></section>' +
        '</div>';
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
